<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Dashboard - Curtains ERP</title>
    <style>
        /* Embedded CSS so the page never looks broken */
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; }
        .dashboard-layout { display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 250px; background: #343a40; color: white; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { margin-top: 0; margin-bottom: 30px; font-size: 22px; text-align: center; border-bottom: 1px solid #4b545c; padding-bottom: 15px; }
        .sidebar a { display: block; color: #c2c7d0; text-decoration: none; padding: 12px 15px; margin-bottom: 8px; border-radius: 5px; transition: 0.2s; }
        .sidebar a:hover { background: #495057; color: white; }
        .sidebar a.active { background: #007bff; color: white; }
        
        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .main-content h1 { color: #333; margin-top: 0; }
        
        /* Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .stat-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid #007bff; }
        .stat-card h3 { color: #6c757d; font-size: 16px; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #333; }
        
        /* Colors */
        .border-success { border-top-color: #28a745 !important; }
        .border-warning { border-top-color: #ffc107 !important; }
        .border-danger { border-top-color: #dc3545 !important; }
        .text-success { color: #28a745; }
        .text-warning { color: #ffc107; }
        .text-danger { color: #dc3545; }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <div class="sidebar">
            <h2>Curtains ERP</h2>
            <a href="dashboard.html" class="active">📊 Dashboard</a>
            <a href="pos.html">🛒 Point of Sale (POS)</a>
            <a href="clients.html">👥 Clients & Debts</a>
            <a href="#" onclick="logout()" style="margin-top: 50px; color: #dc3545;">🚪 Logout</a>
        </div>

        <div class="main-content">
            <h1 id="storeNameHeader">Loading Store...</h1>
            
            <div class="stats-grid">
                <div class="stat-card border-success">
                    <h3>Total Revenue</h3>
                    <div class="value text-success" id="statSales">0 IQD</div>
                </div>
                <div class="stat-card border-warning">
                    <h3>Total Debts (Unpaid)</h3>
                    <div class="value text-warning" id="statDebts">0 IQD</div>
                </div>
                <div class="stat-card border-danger">
                    <h3>Total Expenses</h3>
                    <div class="value text-danger" id="statExpenses">0 IQD</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Get the store ID from memory
            const storeId = localStorage.getItem("active_store_id");
            
            // 2. Security Check: If they bypassed login, kick them out
            if(!storeId) {
                window.location.href = "../../index.html";
                return;
            }

            // 3. Update the Header
            document.getElementById("storeNameHeader").innerText = "Dashboard - Store " + storeId;

            // 4. Fetch the real numbers from Blnd's Laravel API
            // Note: Make sure Laravel is running (`php artisan serve`)
            fetch(`http://127.0.0.1:8000/api/retail/dashboard/${storeId}`)
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        document.getElementById("statSales").innerText = data.data.total_sales.toLocaleString() + " IQD";
                        document.getElementById("statDebts").innerText = data.data.total_debts.toLocaleString() + " IQD";
                        document.getElementById("statExpenses").innerText = data.data.total_expenses.toLocaleString() + " IQD";
                    }
                })
                .catch(error => {
                    console.warn("API not running yet. Displaying default numbers.", error);
                    // If Laravel is turned off, the UI will still show the boxes, but the numbers will stay at 0
                });
        });

        // 5. Logout Function
        function logout() {
            localStorage.clear();
            window.location.href = "../../index.html";
        }
    </script>
</body>
</html>
