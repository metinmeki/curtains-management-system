<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Curtains Management System</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Sign in to manage your stores</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="admin@admin.com">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="loginBtn" class="btn-primary">Login to System</button>
            <div id="errorMessage" class="error-text" style="display: none;">Invalid email or password.</div>
        </form>
    </div>

    <script src="../../assets/js/api.js"></script>
</body>
</html>
