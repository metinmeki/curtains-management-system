    <div style="flex:1;overflow-y:auto;min-height:0;">

        <div class="wh-page-header">

                <div class="wh-page-title">Inventory debts and balances</div>
                <div class="wh-page-sub">Warehouse client balances — separate from retail store debts.</div>
            </div>
            <div class="filter-controls">
                <button class="filter-btn active">All</button>

        <div class="wh-card">
            <div class="wh-table-wrap">

                    <thead>
                        <tr>
                            <th>Client / Store</th>
                            <th>Total supplied</th>
                            <th>Paid</th>
                            <th>Remaining balance</th>
                            <th>Action</th>

                    <tbody id="debtRows"></tbody>

    </div>
    </div>
</div>

</div>

<script src="../js/api.js"></script>
<script src="../js/demo-data.js?v=arabic-en-1"></script>
<script>
    if(!checkAuth()) throw new Error('Not authenticated');
    loadShell('Inventory / Warehouse');
    function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    let _whDebts = [];
    function renderDebts(clients) {
        const debtors = clients.filter(c => (c.total_debt||c.balance||0) > 0);
        document.getElementById('debtRows').innerHTML = debtors.length
            ? debtors.map(c=>`<tr><td style="font-weight:700;">${esc(c.name)}</td><td>${money(c.total_sales||c.totalSales||0)}</td><td style="color:#10b981;">${money(c.total_paid||c.paid||0)}</td><td style="color:#ef4444;font-weight:800;">${money(c.total_debt||c.balance||0)}</td><td><a href="dashboard.html" class="wh-btn wh-btn-sm wh-btn-outline">Pay →</a></td></tr>`).join('')
            : '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:32px;">No outstanding debts.</td></tr>';
    }

    async function loadWhDebts() {
        const token = getToken();
        if (!token || token === 'demo-frontend-token') { renderDebts(inventoryDemo.clients); return; }
        try {
            const res = await fetch(API_BASE_URL + '/warehouse/supplies', { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' } });
            if (res.ok) {
                const r = await res.json();
                const supplies = r.data || [];
                const storeMap = {};
                supplies.forEach(s => {
                    const sid = s.store_id;
                    if (!storeMap[sid]) storeMap[sid] = { name: 'Store ' + sid, total_sales: 0, total_paid: 0, total_debt: 0, _supplies: [] };
                    storeMap[sid].total_sales += parseFloat(s.total||0);
                    storeMap[sid].total_paid  += parseFloat(s.paid||0);
                    storeMap[sid].total_debt  += parseFloat(s.remaining||0);
                    storeMap[sid]._supplies.push(s);
                });
                renderDebts(Object.values(storeMap));
            } else { renderDebts(inventoryDemo.clients); }
        } catch(e) { renderDebts(inventoryDemo.clients); }
    }
    loadWhDebts();
</script>
<script src="../js/i18n.js?v=arabic-en-2"></script>
</body>
</html>
