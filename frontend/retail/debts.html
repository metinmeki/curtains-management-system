<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديون - نظام إدارة الستائر</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">المتجر</div>
                <div class="sidebar-store-name" id="sidebarStoreName">متجر</div>
            </div>

            <ul class="sidebar-menu" id="sidebarMenu">
                <li class="menu-item">
                    <a href="dashboard.html">
                        <span class="menu-icon">📊</span>
                        <span>لوحة التحكم</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="pos.html">
                        <span class="menu-icon">💳</span>
                        <span>نقطة البيع</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="debts.html" class="active">
                        <span class="menu-icon">💰</span>
                        <span>الديون</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="clients.html">
                        <span class="menu-icon">👥</span>
                        <span>العملاء</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="expenses.html">
                        <span class="menu-icon">💸</span>
                        <span>المصاريف</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <button class="logout-btn" onclick="handleLogout()">تسجيل الخروج</button>
            </div>
        </aside>

        <div class="main-content">
            <nav class="navbar">
                <div class="navbar-title" id="pageTitle">الديون</div>
                <div class="navbar-actions">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">A</div>
                        <span id="userName">المستخدم</span>
                    </div>
                </div>
            </nav>

            <div class="content">
                <div class="page-header">
                    <h1 class="page-title">الديون</h1>
                </div>

                <div id="loadingState" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>جاري تحميل البيانات...</p>
                </div>

                <div id="contentState">
                    <div class="card">
                        <div class="card-body">
                            <p>محتوى الصفحة سيتم تحميله هنا</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        if (!checkAuth()) return;
        const storeId = getStoreId();
        const storeName = getStoreName();
        if (!storeId && !storeName) window.location.href = '../landing.html';

        document.getElementById('sidebarStoreName').textContent = storeName;
        const user = getUser();
        if (user && user.name) {
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
        }

        function highlightActiveMenu() {
            const currentPage = window.location.pathname.split('/').pop();
            document.querySelectorAll('.sidebar-menu a').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }
        highlightActiveMenu();

        async function handleLogout() {
            if (confirm('هل أنت متأكد من رغبتك في تسجيل الخروج؟')) {
                await logout();
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
