<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة الستائر</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-errors {
            color: #991b1b;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .login-success {
            color: #065f46;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        .login-demo-hint {
            background-color: #dbeafe;
            color: #0c4a6e;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .form-actions button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">👔</div>
            <h1 class="login-title">نظام إدارة الستائر</h1>
            <p class="login-subtitle">منصة متكاملة لإدارة المبيعات والمخزون</p>

            <form id="loginForm">
                <div id="successMessage" class="alert alert-success" style="display: none;">
                    تم تسجيل الدخول بنجاح، جاري التحويل...
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@curtains.com"
                        required
                    />
                    <div class="login-errors" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                    />
                    <div class="login-errors" id="passwordError"></div>
                </div>

                <div id="generalError" class="alert alert-danger" style="display: none;"></div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span id="btnText">تسجيل الدخول</span>
                    <span id="btnLoader" style="display: none;">
                        <span class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin: 0;"></span>
                    </span>
                </button>

                <div class="login-demo-hint">
                    <strong>بيانات التجربة:</strong><br>
                    البريد: admin@curtains.com<br>
                    كلمة المرور: admin123
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // Clear errors
            document.getElementById('emailError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('generalError').style.display = 'none';

            // Show loading
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';

            try {
                const data = await login(email, password);

                // Show success
                document.getElementById('successMessage').style.display = 'block';

                // Redirect to landing
                setTimeout(() => {
                    window.location.href = 'landing.html';
                }, 1000);

            } catch (error) {
                const errorMsg = error.message || 'حدث خطأ في تسجيل الدخول';

                if (errorMsg.includes('credentials')) {
                    document.getElementById('generalError').textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
                } else {
                    document.getElementById('generalError').textContent = errorMsg;
                }

                document.getElementById('generalError').style.display = 'block';

                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });

        // Redirect if already logged in
        if (getToken()) {
            window.location.href = 'landing.html';
        }
    </script>
</body>
</html>
