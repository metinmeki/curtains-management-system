<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Curtains Management System</title>
    <link rel="stylesheet" href="css/style.css?v=restore-2">
    <style>
        .login-errors {
            color: #991b1b;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .login-demo-hint {
            background-color: #eef5e8;
            color: #31533f;
            padding: 14px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            text-align: left;
            border: 1px solid #c9dcbf;
        }
    </style>
</head>
<body class="ltr">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">CMS</div>
            <h1 class="login-title">Curtains Management System</h1>
            <p class="login-subtitle">Centralized retail and inventory management for four stores and one warehouse.</p>

            <form id="loginForm">
                <div id="successMessage" class="alert alert-success" style="display: none;">
                    Login successful. Redirecting to workspace selection...
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="admin@curtains.com" required>
                    <div class="login-errors" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" value="admin123" required>
                    <div class="login-errors" id="passwordError"></div>
                </div>

                <div id="generalError" class="alert alert-danger" style="display: none;"></div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span id="btnText">Login</span>
                    <span id="btnLoader" style="display: none;">
                        <span class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin: 0;"></span>
                    </span>
                </button>

                <div class="login-demo-hint">
                    <strong>Demo access:</strong><br>
                    Email: admin@curtains.com<br>
                    Password: admin123
                </div>
            </form>
        </div>
    </div>

    <button id="darkModeBtn" class="dark-mode-btn" title="Toggle dark mode" style="position:fixed;top:14px;right:14px;z-index:999;">🌙</button>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            document.getElementById('generalError').style.display = 'none';
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';

            try {
                await login(email, password);
                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'landing.html';
                }, 600);
            } catch (error) {
                document.getElementById('generalError').textContent = error.message || 'Login failed';
                document.getElementById('generalError').style.display = 'block';
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });

        if (getToken()) {
            window.location.href = 'landing.html';
        }

        // Dark mode
        (function() {
            const btn = document.getElementById('darkModeBtn');
            function applyDark(on) {
                document.body.classList.toggle('dark', on);
                btn.textContent = on ? '☀️' : '🌙';
            }
            applyDark(localStorage.getItem('dark_mode') === '1');
            btn.addEventListener('click', function() {
                const on = !document.body.classList.contains('dark');
                applyDark(on);
                localStorage.setItem('dark_mode', on ? '1' : '0');
            });
        })();
    </script>
    <script src="js/i18n.js?v=arabic-en-2"></script>
</body>
</html>
