<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Workspace - Curtains Management System</title>
    <link rel="stylesheet" href="css/style.css?v=mobile-1">
</head>
<body class="ltr">
    <nav class="navbar">
        <div class="navbar-brand">
            <span class="navbar-brand-logo">CMS</span>
            <span class="navbar-brand-text">Curtains Management System</span>
        </div>
        <div class="user-section">
            <span class="scope-pill">Owner/Admin view</span>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <span class="user-name" id="userName">Admin</span>
            </div>
            <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
            <button id="darkModeBtn" class="dark-mode-btn" title="Toggle dark mode">🌙</button>
        </div>
    </nav>

    <main style="max-width: 1180px; margin: 0 auto; padding: 34px 24px;">
        <div class="page-header">
            <div>
                <h1 class="page-title">Choose a store or inventory workspace</h1>
            </div>
        </div>

        <div id="storeCardsContainer" class="store-cards-grid"></div>

        <!-- ══════════ Cashier Management ══════════ -->
        <section id="cashierSection" style="margin-top:36px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                <div>
                    <h2 style="font-size:20px;font-weight:800;color:var(--text-dark);margin:0;">👥 Cashiers</h2>
                    <p style="font-size:13px;color:var(--text-gray);margin:3px 0 0;">Cashiers can only access POS and Debts pages. Click Enter to open a store in cashier mode.</p>
                </div>
                <button class="btn btn-primary" onclick="openAddCashier()" id="addCashierBtn" style="padding:7px 16px;font-size:13px;">+ Add Cashier</button>
            </div>

            <!-- Add form -->
            <div id="addCashierForm" style="display:none;background:var(--surface-soft);border:1px solid var(--border-color);border-radius:10px;padding:18px;margin-bottom:16px;">
                <div style="font-size:13px;font-weight:800;color:var(--text-dark);margin-bottom:12px;">New Cashier</div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;">
                    <div>
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-gray);display:block;margin-bottom:4px;">Name <span style="color:#b4534a;">*</span></label>
                        <input id="cashierNameInput" type="text" placeholder="e.g. Ahmed" style="width:100%;padding:8px 10px;border:1px solid var(--border-color);border-radius:6px;font-size:13px;background:var(--surface-color);color:var(--text-dark);">
                    </div>
                    <div>
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-gray);display:block;margin-bottom:4px;">PIN (4 digits)</label>
                        <input id="cashierPinInput" type="text" inputmode="numeric" maxlength="4" placeholder="e.g. 1234" style="width:100%;padding:8px 10px;border:1px solid var(--border-color);border-radius:6px;font-size:13px;background:var(--surface-color);color:var(--text-dark);">
                    </div>
                    <div>
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-gray);display:block;margin-bottom:4px;">Assigned Store</label>
                        <select id="cashierStoreInput" style="width:100%;padding:8px 10px;border:1px solid var(--border-color);border-radius:6px;font-size:13px;background:var(--surface-color);color:var(--text-dark);">
                            <option value="">Any store</option>
                        </select>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-success" onclick="saveCashier()" style="padding:8px 14px;font-size:13px;">Save</button>
                        <button class="btn" onclick="closeAddCashier()" style="padding:8px 14px;font-size:13px;">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div id="cashierTableWrap">
                <table style="width:100%;border-collapse:collapse;background:var(--surface-color);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                    <thead>
                        <tr style="background:var(--surface-soft);">
                            <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-gray);border-bottom:1px solid var(--border-color);">Name</th>
                            <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-gray);border-bottom:1px solid var(--border-color);">PIN</th>
                            <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-gray);border-bottom:1px solid var(--border-color);">Assigned Store</th>
                            <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-gray);border-bottom:1px solid var(--border-color);"></th>
                        </tr>
                    </thead>
                    <tbody id="cashierTableBody"></tbody>
                </table>
                <div id="cashierEmpty" style="display:none;text-align:center;padding:32px;color:var(--text-gray);font-size:14px;background:var(--surface-color);border-radius:10px;border:1px dashed var(--border-color);">No cashiers yet. Click + Add Cashier to get started.</div>
            </div>
        </section>

    </main>

    <script src="js/api.js"></script>
    <script>
        (function() {
            const btn = document.getElementById('darkModeBtn');
            function applyDark(on) {
                document.body.classList.toggle('dark', on);
                if (btn) btn.textContent = on ? '☀️' : '🌙';
            }
            applyDark(localStorage.getItem('dark_mode') === '1');
            if (btn) btn.addEventListener('click', function() {
                const on = !document.body.classList.contains('dark');
                applyDark(on);
                localStorage.setItem('dark_mode', on ? '1' : '0');
            });
        })();
    </script>
    <script>
        if (!checkAuth()) {
            window.location.href = 'index.html';
        }

        function esc(v) {
            return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
            });
        }

        const STORE_NAMES_KEY = 'cms_store_custom_names';

        const storeDefaults = [
            { id: 1, name: 'Store 1', description: 'Independent retail workspace for POS, debts, clients, expenses, and store reports.', icon: 'S1', type: 'retail' },
            { id: 2, name: 'Store 2', description: 'Separate sales and client records for the second retail branch.', icon: 'S2', type: 'retail' },
            { id: 3, name: 'Store 3', description: 'Dedicated dashboard and transactions for the third retail branch.', icon: 'S3', type: 'retail' },
            { id: 4, name: 'Store 4', description: 'Standalone retail workspace for the fourth branch.', icon: 'S4', type: 'retail' },
            { id: 'wh', name: 'Inventory / Warehouse', description: 'Central warehouse: supply items to all 5 stores, track store accounts, balances, and debt records.', icon: 'WH', type: 'inventory' }
        ];

        function getCustomNames() {
            return JSON.parse(localStorage.getItem(STORE_NAMES_KEY) || '{}');
        }

        function saveCustomName(storeKey, name) {
            const names = getCustomNames();
            names[storeKey] = name.trim();
            localStorage.setItem(STORE_NAMES_KEY, JSON.stringify(names));
        }

        function getStoresList() {
            const custom = getCustomNames();
            return storeDefaults.map(s => ({
                ...s,
                name: custom[String(s.id)] || s.name
            }));
        }

        function loadUserInfo() {
            const user = getUser();
            if (user && user.name) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
            }
        }

        function renderStoreCards() {
            const container = document.getElementById('storeCardsContainer');
            container.innerHTML = getStoresList().map(store => `
                <div class="store-card-wrapper" style="position:relative;">
                    <a href="#" class="store-card" id="card-${store.id}" onclick="selectStore('${store.id}', '${store.type}'); return false;">
                        <div class="store-card-icon">${store.icon}</div>
                        <div class="store-card-body">
                            <div>
                                <div class="store-card-title" id="title-${store.id}">${store.name}</div>
                            </div>
                            <div class="store-card-footer">Enter workspace</div>
                        </div>
                    </a>
                    <button class="store-rename-btn" title="Rename" onclick="startRename('${store.id}', event)">✎</button>
                </div>
            `).join('');
        }

        function startRename(storeKey, e) {
            e.preventDefault();
            e.stopPropagation();
            const titleEl = document.getElementById('title-' + storeKey);
            const current = titleEl.textContent;
            titleEl.innerHTML = `<input id="rename-input-${storeKey}" class="store-rename-input" value="${esc(current)}" maxlength="40" onclick="event.stopPropagation()" />`;
            const input = document.getElementById('rename-input-' + storeKey);
            input.focus();
            input.select();
            input.addEventListener('keydown', function(ev) {
                if (ev.key === 'Enter') confirmRename(storeKey);
                if (ev.key === 'Escape') renderStoreCards();
            });
            input.addEventListener('blur', function() { confirmRename(storeKey); });
        }

        function confirmRename(storeKey) {
            const input = document.getElementById('rename-input-' + storeKey);
            if (!input) return;
            const newName = input.value.trim();
            if (newName) saveCustomName(storeKey, newName);
            renderStoreCards();
        }

        function selectStore(storeKey, type) {
            localStorage.removeItem('cms_active_cashier'); // admin entering store — clear cashier session
            const name = getStoresList().find(s => String(s.id) === String(storeKey))?.name || storeKey;
            if (type === 'inventory') {
                removeStoreSelection();
                localStorage.setItem('store_name', name);
                localStorage.setItem('inventory_unit_id', '1');
            } else {
                setStoreSelection(Number(storeKey), name);
            }
            window.location.href = type === 'inventory'
                ? 'inventory/dashboard.html'
                : 'retail/dashboard.html';
        }

        async function handleLogout() {
            if (confirm('Logout from the system?')) {
                await logout();
                window.location.href = 'index.html';
            }
        }

        // ── Cashier management ─────────────────────────────────────────────────
        const CASHIERS_KEY = 'cms_cashiers';

        function getCashiers() { return JSON.parse(localStorage.getItem(CASHIERS_KEY) || '[]'); }
        function saveCashiers(arr) { localStorage.setItem(CASHIERS_KEY, JSON.stringify(arr)); }
        function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

        function getStoreOptions() {
            return getStoresList()
                .filter(s => s.type === 'retail')
                .map(s => `<option value="${s.id}">${s.name}</option>`)
                .join('');
        }

        function openAddCashier() {
            const form = document.getElementById('addCashierForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
            if (form.style.display === 'block') {
                document.getElementById('cashierStoreInput').innerHTML = '<option value="">Any store</option>' + getStoreOptions();
                document.getElementById('cashierNameInput').value = '';
                document.getElementById('cashierPinInput').value = '';
                document.getElementById('cashierNameInput').focus();
            }
        }

        function closeAddCashier() {
            document.getElementById('addCashierForm').style.display = 'none';
        }

        async function saveCashier() {
            const name = document.getElementById('cashierNameInput').value.trim();
            const pin  = document.getElementById('cashierPinInput').value.trim();
            const storeId = document.getElementById('cashierStoreInput').value;
            if (!name) { document.getElementById('cashierNameInput').focus(); return; }
            if (pin && !/^\d{4}$/.test(pin)) { alert('PIN must be exactly 4 digits'); return; }
            const cashiers = getCashiers();
            cashiers.push({ id: uid(), name, pin: pin || '', storeId: storeId ? Number(storeId) : null });
            saveCashiers(cashiers);
            // Auto-create cashier user in Laravel database with store_id and role
            try {
                const token = localStorage.getItem('auth_token');
                const email = name.toLowerCase().replace(/\s+/g, '') + '@curtains.com';
                await fetch('http://127.0.0.1:8000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ name, email, password: pin || '0000', store_id: storeId ? Number(storeId) : null, role: 'cashier' })
                });
            } catch(e) {}
            closeAddCashier();
            renderCashierTable();
        }

        function deleteCashier(id) {
            if (!confirm('Remove this cashier?')) return;
            saveCashiers(getCashiers().filter(c => c.id !== id));
            renderCashierTable();
        }

        function renderCashierTable() {
            const cashiers = getCashiers();
            const tbody = document.getElementById('cashierTableBody');
            const empty = document.getElementById('cashierEmpty');
            const table = document.querySelector('#cashierTableWrap table');
            if (!cashiers.length) {
                if (table) table.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            if (table) table.style.display = '';
            empty.style.display = 'none';
            tbody.innerHTML = cashiers.map(c => {
                const storeLabel = c.storeId
                    ? (getStoresList().find(s => String(s.id) === String(c.storeId))?.name || 'Store ' + c.storeId)
                    : 'Any store';
                return `
                <tr style="border-bottom:1px solid var(--border-color);">
                    <td style="padding:12px 16px;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div style="width:32px;height:32px;border-radius:50%;background:var(--primary-color);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;">${esc(c.name.charAt(0).toUpperCase())}</div>
                            <span style="font-weight:700;color:var(--text-dark);">${esc(c.name)}</span>
                        </div>
                    </td>
                    <td style="padding:12px 16px;color:var(--text-gray);font-family:monospace;">${c.pin ? '••••' : '<span style="color:var(--text-gray);font-size:12px;">No PIN</span>'}</td>
                    <td style="padding:12px 16px;color:var(--text-gray);">${esc(storeLabel)}</td>
                    <td style="padding:12px 16px;">
                        <button class="btn btn-danger" style="padding:4px 10px;font-size:12px;" onclick="deleteCashier('${esc(c.id)}')">Remove</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function enterAsCashier(cashierId) {
            const c = getCashiers().find(x => x.id === cashierId);
            if (!c || !c.storeId) return;
            enterAsCashierStore(cashierId, c.storeId);
        }

        function enterAsCashierStore(cashierId, storeId) {
            const c = getCashiers().find(x => x.id === cashierId);
            if (!c) return;
            const storeName = getStoresList().find(s => String(s.id) === String(storeId))?.name || 'Store ' + storeId;
            localStorage.setItem('cms_active_cashier', JSON.stringify({ id: c.id, name: c.name, storeId: Number(storeId) }));
            localStorage.setItem('store_id', String(storeId));
            localStorage.setItem('store_name', storeName);
            localStorage.setItem('auth_token', 'demo-frontend-token');
            window.location.href = 'retail/pos.html';
        }

        window.addEventListener('load', () => {
            loadUserInfo();
            renderStoreCards();
            renderCashierTable();
            if (window.applyLanguage) applyLanguage();
        });
    </script>
    <script src="js/i18n.js?v=arabic-en-2"></script>
</body>
</html>
